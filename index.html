<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#080d12">
    <title>YAKINDA</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #080d12; overflow: hidden; touch-action: none; }
      #unity-canvas { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; background: #080d12; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                 color: #76c6cb; font: 600 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .2em; }
      #loading h1 { color: #f1f4f4; font-size: 42px; letter-spacing: .3em; margin: 0 0 18px 0; }
      #bar { width: 220px; height: 4px; background: #20303a; border-radius: 4px; overflow: hidden; }
      #fill { width: 0; height: 100%; background: #76c6cb; transition: width .2s; }
      #err { color: #db5a5a; max-width: 80vw; text-align: center; letter-spacing: 0; margin-top: 16px; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><h1>YAKINDA</h1><div id="bar"><div id="fill"></div></div><div id="msg" style="margin-top:12px">YÜKLENİYOR</div><div id="err"></div></div>
    <script src="Build/WebGL.loader.js"></script>
    <script>
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/WebGL.data",
        frameworkUrl: "Build/WebGL.framework.js",
        codeUrl: "Build/WebGL.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Yakinda",
        productName: "YAKINDA",
        productVersion: "0.1.0",
      }, (p) => {
        document.getElementById("fill").style.width = Math.round(p * 100) + "%";
      }).then(() => {
        document.getElementById("loading").remove();
      }).catch((message) => {
        document.getElementById("msg").textContent = "AÇILAMADI";
        document.getElementById("err").textContent = message;
      });
    </script>
  </body>
</html>
